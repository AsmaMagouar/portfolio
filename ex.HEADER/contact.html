<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="jiji">NAJM Digital Academy</h1>
        <nav>
            <ul>
            <li><a href="accueil.html">Accueil</a></li>
            <li><a href="formation.html">Formation</a></li>
            <li><a href="contact.html">Contact</a></li>
            </ul>
            </nav> 
            </header>
       <main >
        <h1>Contactez-nous</h1>
        <p>Remplissez le formulaireci-dessous et nous vous répondrons dans les plus brefs délais.</p>
<label for="nom">Nom complet :</label>
        <input type="text" id="nom" name="nom"  placeholder=" votre nom complet" required> <br> <br>
<label for="email">Adresse e-mail :</label>
        <input type="email" id="email" name="email"  placeholder=" example@gmail.com" required> <br> <br>
<label for="pasw">Mot de passe :</label>
        <input type="password" id="pasw" name="pasw"  placeholder=" votre mot de passe" required> <br> <br>
<fieldset>
        <legend>Formation souhaitée :</legend>
       <input type="radio" id="formation1" name="formation" value="formation1">
        <label for="formation1">HTML/CSS</label>
     <input type="radio" id="formation2" name="formation" value="formation2">
        <label for="formation2">JavaScript</label>
     <input type="radio" id="formation3" name="formation" value="formation3">
        <label for="formation3">MERN Stack</label>
</fieldset> <br>
<fieldset>
<legend>Services souhaités :</legend>
<input type="checkbox" id="service1" name="service" >
        <label for="service1">Docummentation</label>
     <input type="checkbox" id="service2" name="service" >
        <label for="service2">visite de l'académie</label>
     <input type="checkbox" id="service3" name="service" >
        <label for="service3">Conseil d'orientation</label>
</fieldset> <br> <br>
<label for="date">Date de visite :</label>
        <input type="date" id="date" name="date" required> <br> <br>

        <label for="message">Message :</label> <br> <br>
        <textarea id="message" name="message" placeholder="Votre message ici..." required rows="8" cols="50"></textarea> <br> <br>
        <button type="submit">Envoyer</button>
        <button type="reset">Réinitialiser</button> <br> <br>
        <a href="accueil.html">Retour à l'accueil</a>
       </main>    
       <footer>
        <p>&copy; 2026 NAJM Digital Academy. Tous droits réservés.</p>
       </footer>
</body>
</html>
